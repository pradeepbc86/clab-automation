version: '3.8'
services:
  netbox:
    image: netboxcommunity/netbox:latest
    ports:
      - "8000:8080"
    environment:
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      POSTGRES_HOST_AUTH_METHOD: trust
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
