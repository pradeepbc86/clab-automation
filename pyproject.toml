[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clab-auto-config"
version = "0.1.0"
dependencies = [
    "napalm>=4.0.0",
    "netmiko>=4.0.0",
    "pynetbox>=7.0.0",
    "jinja2>=3.0.0",
    "requests>=2.28.0",
    "salt>=3006.0",
]

[tool.ruff]
line-length = 100
